# QMD Configuration File
# D:\QMD-Index\qmd.yml

collections:
  # OpenClaw workspace - primary knowledge base
  openclaw:
    path: C:/Users/sile1618/.openclaw/workspace
    pattern: "**/*.md"
    ignore:
      - "node_modules/**"
      - ".git/**"
      - "skills/**/node_modules/**"
      - "**/.venv/**"
  
  # OpenClaw memory (long-term memory)
  openclaw-memory:
    path: C:/Users/sile1618/.openclaw/workspace/memory
    pattern: "**/*.md"
    ignore:
      - "backups/**"
      - ".dreams/**"

  # OpenClaw skills documentation
  openclaw-skills:
    path: C:/Users/sile1618/.openclaw/workspace/skills
    pattern: "**/SKILL.md"

# Global context
global_context: "OpenClaw AI 助手系统知识库，包含配置文件、技能文档、对话记忆"

# Model configuration
# Docker CPU setup — ports 2780 (embedding) / 2781 (reranker)
# Port 2780: embeddinggemma-300M-Q8_0.gguf (向量模型)
# Port 2781: qwen3-reranker-0.6b-q8_0.gguf (重排模型)
models:
  # Embedding: EmbeddingGemma-300M via local llama-server (CPU)
  embedding_model_url: "http://127.0.0.1:2780/v1"
  embedding_model_name: "embeddinggemma-300M-Q8_0.gguf"
  embedding_dim: 768
  
  # Reranker: Qwen3-Reranker-0.6B via local llama-server (CPU)
  reranker_model_url: "http://127.0.0.1:2781/v1"
  reranker_model_name: "qwen3-reranker-0.6b-q8_0.gguf"
  
  # Query Expansion: QMD Query Expansion (local GGUF)
  query_expansion_model: "E:/QMD-Index/models/qmd-query-expansion-1.7B-q4_k_m.gguf"

# Search defaults
defaults:
  limit: 10
  min_score: 0.3
  rerank: true