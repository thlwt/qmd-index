# QMD Configuration File
# Copy this to qmd.yml and customize for your environment.

collections:
  # Example: index all markdown files in a directory
  docs:
    path: /path/to/your/markdown/files
    pattern: "**/*.md"
    ignore:
      - "node_modules/**"
      - ".git/**"

  # Example: another collection
  wiki:
    path: /path/to/your/wiki
    pattern: "**/*.md"

# Global context — describes the purpose of your knowledge base
# This is passed to the LLM for query expansion and reranking
global_context: "Personal knowledge base"

# Model configuration
# Using llama.cpp server for embeddings and reranking
models:
  # Embedding model (via llama-server API)
  embedding_model_url: "http://127.0.0.1:1278/v1"
  embedding_model_name: "your-embedding-model.gguf"
  embedding_dim: 1024

  # Reranker model (via llama-server API)
  reranker_model_url: "http://127.0.0.1:1245/v1"
  reranker_model_name: "your-reranker-model.gguf"

  # Query Expansion model (local GGUF file)
  query_expansion_model: "/path/to/your/query-expansion-model.gguf"

# Search defaults
defaults:
  limit: 10
  min_score: 0.3
  rerank: true
